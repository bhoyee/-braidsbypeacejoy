<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132a6b"/><stop offset="1" stop-color="#0b1a4a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4960f"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b1a4a" flood-opacity="0.12"/></filter>
    <style>
      .title{font-size:15px;font-weight:700;fill:#0b1a4a}
      .sub{font-size:12px;fill:#475569}
      .wtitle{font-size:15px;font-weight:700;fill:#ffffff}
      .wsub{font-size:12px;fill:#c7d2fe}
      .chip{font-size:12px;fill:#0b1a4a;font-weight:600}
      .lbl{font-size:11.5px;fill:#475569}
      .glbl{font-size:11.5px;fill:#9a6a00;font-weight:600}
      .head{font-size:12px;font-weight:700;letter-spacing:2px;fill:#1e3a8a}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fffaf0"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0b1a4a">Braids by Peace Joy — system architecture</text>
  <text x="40" y="68" class="sub">One Node.js (Next.js 16) app on cPanel serves pages, API and the owner area, next to its MySQL database.</text>

  <!-- Column headers -->
  <text x="40" y="112" class="head">PEOPLE</text>
  <text x="330" y="112" class="head">CPANEL HOSTING (LITESPEED · CLOUDLINUX)</text>
  <text x="930" y="112" class="head">SERVICES</text>

  <!-- People -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="230" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="60" y="160" class="title">Clients</text>
    <text x="60" y="181" class="sub">Browse styles, book, pay deposit</text>
    <text x="60" y="198" class="sub">and balance · phone or desktop</text>

    <rect x="40" y="240" width="230" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="60" y="270" class="title">Salon owner / admins</text>
    <text x="60" y="291" class="sub">Manage Bookings (/manage)</text>
    <text x="60" y="308" class="sub">email sign-in link · 30-day session</text>

    <rect x="40" y="350" width="230" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="60" y="380" class="title">Search &amp; AI assistants</text>
    <text x="60" y="401" class="sub">Google, Bing, ChatGPT, Claude…</text>
    <text x="60" y="418" class="sub">sitemap · robots · llms.txt · JSON-LD</text>
  </g>

  <!-- Hosting box -->
  <rect x="320" y="124" width="560" height="470" rx="20" fill="#eef1f8" stroke="#c7d2fe" stroke-dasharray="6 5"/>

  <!-- Next.js app -->
  <g filter="url(#shadow)">
    <rect x="345" y="145" width="510" height="250" rx="16" fill="url(#navy)"/>
    <text x="368" y="176" class="wtitle">Next.js 16 app  (node server.js)</text>
    <text x="368" y="196" class="wsub">React 19 · Tailwind 4 · server actions · Prisma 6</text>
    <rect x="368" y="212" width="152" height="74" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffc72c" stroke-opacity="0.5"/>
    <text x="380" y="234" class="wtitle" font-size="13">Public pages</text>
    <text x="380" y="253" class="wsub">/ · /styles · /book</text>
    <text x="380" y="270" class="wsub">/pay · /faq · /policies</text>
    <rect x="532" y="212" width="152" height="74" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffc72c" stroke-opacity="0.5"/>
    <text x="544" y="234" class="wtitle" font-size="13">API routes</text>
    <text x="544" y="253" class="wsub">availability · checkout</text>
    <text x="544" y="270" class="wsub">webhooks · cron · review</text>
    <rect x="696" y="212" width="140" height="74" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffc72c" stroke-opacity="0.5"/>
    <text x="708" y="234" class="wtitle" font-size="13">Owner area</text>
    <text x="708" y="253" class="wsub">/manage · alerts</text>
    <text x="708" y="270" class="wsub">reschedule · refunds</text>
    <rect x="368" y="300" width="468" height="78" rx="10" fill="#ffc72c" fill-opacity="0.12" stroke="#ffc72c" stroke-opacity="0.6"/>
    <text x="380" y="322" class="wtitle" font-size="13">Booking engine &amp; automation</text>
    <text x="380" y="341" class="wsub">Slot lock (SELECT … FOR UPDATE) · 31-min checkout holds · idempotent confirmation</text>
    <text x="380" y="358" class="wsub">Reminders 24 h / 2 h · review request · come-back emails · daily summary</text>
  </g>

  <!-- DB + cron -->
  <g filter="url(#shadow)">
    <rect x="345" y="420" width="250" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="365" y="450" class="title">MySQL / MariaDB</text>
    <text x="365" y="472" class="sub">Bookings · Payments · Services</text>
    <text x="365" y="490" class="sub">ActivityLog · EmailContact</text>
    <text x="365" y="508" class="sub">AdminLoginToken · Setting</text>
    <text x="365" y="534" class="lbl">Prisma migrations applied</text>
    <text x="365" y="551" class="lbl">automatically on deploy</text>

    <rect x="615" y="420" width="240" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="635" y="450" class="title">cPanel cron</text>
    <text x="635" y="472" class="sub">every minute →</text>
    <text x="635" y="490" class="sub">/api/cron/reminders</text>
    <text x="635" y="516" class="sub">every 2 minutes →</text>
    <text x="635" y="534" class="sub">server-deploy.sh</text>
    <text x="635" y="556" class="lbl">(pull · install · migrate · restart)</text>
  </g>

  <!-- Services -->
  <g filter="url(#shadow)">
    <rect x="930" y="130" width="230" height="96" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="930" y="130" width="6" height="96" rx="3" fill="#635bff"/>
    <text x="950" y="160" class="title">Stripe</text>
    <text x="950" y="181" class="sub">Checkout (card · Apple Pay ·</text>
    <text x="950" y="198" class="sub">Google Pay · Link) · refunds</text>
    <text x="950" y="215" class="lbl">signed webhook back to the app</text>

    <rect x="930" y="246" width="230" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="930" y="246" width="6" height="86" rx="3" fill="#1e3a8a"/>
    <text x="950" y="276" class="title">Email (cPanel SMTP)</text>
    <text x="950" y="297" class="sub">Nodemailer · branded HTML</text>
    <text x="950" y="314" class="sub">clients + every admin email</text>

    <rect x="930" y="352" width="230" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="930" y="352" width="6" height="86" rx="3" fill="#25d366"/>
    <text x="950" y="382" class="title">WhatsApp (CallMeBot)</text>
    <text x="950" y="403" class="sub">owner alerts · reminders</text>
    <text x="950" y="420" class="sub">· evening summary</text>

    <rect x="930" y="458" width="230" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="930" y="458" width="6" height="86" rx="3" fill="#ea4335"/>
    <text x="950" y="488" class="title">Google</text>
    <text x="950" y="509" class="sub">Maps embed · review form</text>
    <text x="950" y="526" class="sub">(/review short link · QR poster)</text>
  </g>

  <!-- Arrows: people -> app -->
  <path d="M270 173 H345" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="164" class="lbl">HTTPS</text>
  <path d="M270 283 C305 283 315 260 345 260" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M270 393 C310 393 320 370 345 370" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- app <-> db, cron -> app -->
  <path d="M470 395 V420" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M735 420 V395" stroke="#d4960f" stroke-width="2" fill="none" marker-end="url(#arrowGold)"/>

  <!-- app <-> services -->
  <path d="M855 175 H930" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M930 205 C895 205 890 228 855 228" stroke="#635bff" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text x="866" y="244" class="lbl" fill="#635bff">webhook</text>
  <path d="M855 300 C895 300 895 289 930 289" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M855 340 C900 340 895 395 930 395" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M855 375 C905 375 895 500 930 500" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- CI/CD strip -->
  <g filter="url(#shadow)">
    <rect x="40" y="620" width="1120" height="104" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="62" y="648" class="head">CI / CD — EVERY PUSH TO MAIN GOES LIVE</text>
  <g font-size="13" font-weight="600" fill="#0b1a4a">
    <rect x="62" y="664" width="170" height="40" rx="20" fill="#eef1f8"/><text x="147" y="689" text-anchor="middle">git push → main</text>
    <rect x="272" y="664" width="230" height="40" rx="20" fill="#eef1f8"/><text x="387" y="689" text-anchor="middle">GitHub Actions: build</text>
    <rect x="542" y="664" width="210" height="40" rx="20" fill="#eef1f8"/><text x="647" y="689" text-anchor="middle">publish → deploy branch</text>
    <rect x="792" y="664" width="180" height="40" rx="20" fill="#eef1f8"/><text x="882" y="689" text-anchor="middle">server pulls (cron)</text>
    <rect x="1012" y="664" width="128" height="40" rx="20" fill="#ffc72c"/><text x="1076" y="689" text-anchor="middle">/api/health ✓</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M232 684 H272"/><path d="M502 684 H542"/><path d="M752 684 H792"/><path d="M972 684 H1012"/>
  </g>
</svg>
