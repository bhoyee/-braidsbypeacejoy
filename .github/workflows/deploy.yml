# Braids by Peace Joy — CI/CD
#
#   push to main
#     └─ 1. build    type-check + production build, publish it to the `deploy` branch
#     └─ 2. go live  wait until the cPanel server has pulled the build, migrated the
#                    database and restarted (it reports the commit at /api/health)
#
# The whole site (pages, API, database) runs on the cPanel hosting. The server pulls
# the `deploy` branch itself every 2 minutes (deploy/server-deploy.sh via cron), so
# no server passwords or keys live in GitHub.
#
# Repository → Settings → Secrets and variables → Actions → Variables:
#   SITE_URL   https://braidsbypeacejoy.com
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels an older run that hasn't finished.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write # to publish the `deploy` branch

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check required settings
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::Set the SITE_URL repository variable (e.g. https://braidsbypeacejoy.com) — it is baked into the build and used for Stripe redirects."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          # NEXT_PUBLIC_* values are inlined at build time (server code included).
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package the release
        run: |
          mkdir release
          cp -a .next release/.next
          rm -rf release/.next/cache
          # Point server-external packages (Prisma) at the server's own node_modules.
          node deploy/link-next-externals.mjs release/.next
          cp -a public prisma deploy release/
          cp package.json package-lock.json server.js next.config.mjs release/
          echo "${GITHUB_SHA}" > release/DEPLOY_VERSION
          du -sh release

      - name: Publish to the deploy branch
        working-directory: release
        env:
          # Passed via env (never interpolated into the script) so commit text can't inject shell code.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          FIRST_LINE="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
          git init -q
          git checkout -q -b deploy
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Release ${GITHUB_SHA::7}: ${FIRST_LINE}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
          echo "Published release ${GITHUB_SHA::7} to the deploy branch"

  live:
    name: Go live (cPanel)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the server to deploy this release
        run: |
          URL="${{ vars.SITE_URL }}/api/health"
          # Until the one-time server setup (deploy/bootstrap.sh) has run, the domain
          # doesn't serve this app yet: don't fail the pipeline for that.
          FIRST="$(curl -fsS --max-time 20 "$URL" 2>/dev/null || true)"
          if ! echo "$FIRST" | grep -q '"version"'; then
            echo "::warning::$URL is not serving the app yet — run the one-time server setup (DEPLOYMENT.md). Skipping the live check."
            exit 0
          fi
          echo "Waiting for $URL to report ${GITHUB_SHA::7} (the server checks for new releases every 2 minutes)…"
          for i in $(seq 1 80); do
            BODY="$(curl -fsS --max-time 20 "$URL" 2>/dev/null || true)"
            if echo "$BODY" | grep -q "\"version\":\"${GITHUB_SHA}\""; then
              echo "✅ Live: $BODY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The server did not go live with this release within ~13 minutes. In cPanel → Terminal run: tail -50 ~/bbpj-deploy/deploy.log"
          echo "Last response: $BODY"
          exit 1
