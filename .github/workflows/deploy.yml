# Braids by Peace Joy — CI/CD
#
#   push to main
#     └─ 1. build      type-check + production build, publish it to the `deploy` branch
#     └─ 2. backend    wait until the cPanel server has pulled the build, migrated the
#                      database and restarted (it reports the commit at /api/health)
#     └─ 3. frontend   deploy to Vercel (only after the backend is live)
#
# The cPanel server pulls the `deploy` branch itself every 2 minutes
# (deploy/server-deploy.sh via cPanel Cron) — no server passwords live in GitHub.
#
# Repository → Settings → Secrets and variables → Actions:
#   Variables: SITE_URL     https://braidsbypeacejoy.com
#              API_ORIGIN   https://api.braidsbypeacejoy.com
#   Secrets:   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels an older run that hasn't finished.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write # to publish the `deploy` branch

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required settings
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::Set the SITE_URL repository variable (e.g. https://braidsbypeacejoy.com) — it is baked into the build and used for Stripe redirects."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          # NEXT_PUBLIC_* values are inlined at build time (server code included).
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package the release
        run: |
          mkdir release
          cp -a .next release/.next
          rm -rf release/.next/cache
          # Point server-external packages (Prisma) at the server's own node_modules.
          node deploy/link-next-externals.mjs release/.next
          cp -a public prisma deploy release/
          cp package.json package-lock.json server.js next.config.mjs release/
          echo "${GITHUB_SHA}" > release/DEPLOY_VERSION
          du -sh release

      - name: Publish to the deploy branch
        working-directory: release
        env:
          # Passed via env (never interpolated into the script) so commit text can't inject shell code.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          FIRST_LINE="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
          git init -q
          git checkout -q -b deploy
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Release ${GITHUB_SHA::7}: ${FIRST_LINE}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
          echo "Published release ${GITHUB_SHA::7} to the deploy branch"

  backend:
    name: Wait for backend (cPanel)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the server to deploy this release
        run: |
          if [ -z "${{ vars.API_ORIGIN }}" ]; then
            echo "::warning::API_ORIGIN variable not set — skipping the backend check."
            exit 0
          fi
          URL="${{ vars.API_ORIGIN }}/api/health"
          echo "Waiting for $URL to report ${GITHUB_SHA::7} (the server checks for new releases every 2 minutes)…"
          for i in $(seq 1 80); do
            BODY="$(curl -fsS --max-time 20 "$URL" 2>/dev/null || true)"
            if echo "$BODY" | grep -q "\"version\":\"${GITHUB_SHA}\""; then
              echo "✅ Backend is live: $BODY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The server did not pick up this release within ~13 minutes. Check ~/bbpj-deploy/deploy.log on the server (cPanel → Terminal: tail -50 ~/bbpj-deploy/deploy.log)."
          echo "Last response: $BODY"
          exit 1

  frontend:
    name: Deploy frontend (Vercel)
    needs: backend
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not set — skipping the frontend deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Deploy to Vercel (production)
        if: steps.check.outputs.skip != 'true'
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "✅ Frontend deployed: $URL"
